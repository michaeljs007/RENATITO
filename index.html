    <script>
      (function() {
        // Gracefully handle Vite HMR WebSocket in Cloud Run iFrame sandbox
        try {
          var OriginalWS = window.WebSocket;
          if (OriginalWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && url.includes('token='))) {
                var dummy = new EventTarget();
                dummy.binaryType = 'blob';
                dummy.readyState = 1; // WebSocket.OPEN
                dummy.url = url;
                dummy.protocol = 'vite-hmr';
                dummy.extensions = '';
                dummy.bufferedAmount = 0;
                dummy.send = function() {};
                dummy.close = function() {};
                setTimeout(function() {
                  dummy.dispatchEvent(new Event('open'));
                }, 0);
                return dummy;
              }
              return new OriginalWS(url, protocols);
            };
            window.WebSocket.prototype = OriginalWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
          window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason && e.reason.stack).includes('@vite/client'))) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);
          window.addEventListener('error', function(e) {
            if ((e.message && e.message.includes('WebSocket')) || (e.filename && e.filename.includes('@vite/client'))) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
